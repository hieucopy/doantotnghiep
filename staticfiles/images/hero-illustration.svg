<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Elements -->
    <circle cx="300" cy="200" r="180" fill="#FEE2E2" opacity="0.3"/>
    <circle cx="300" cy="200" r="120" fill="#FECACA" opacity="0.4"/>
    
    <!-- Phone Tower -->
    <path d="M280 80L320 80L300 40L280 80Z" fill="#DC2626"/>
    <rect x="295" y="80" width="10" height="200" fill="#DC2626"/>
    <path d="M260 140L340 140L300 100L260 140Z" fill="#DC2626"/>
    <path d="M270 180L330 180L300 150L270 180Z" fill="#DC2626"/>
    <path d="M280 220L320 220L300 200L280 220Z" fill="#DC2626"/>
    
    <!-- Signal Waves -->
    <circle cx="300" cy="200" r="40" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <circle cx="300" cy="200" r="60" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4" opacity="0.5"/>
    <circle cx="300" cy="200" r="80" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
    <circle cx="300" cy="200" r="100" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
    
    <!-- Devices -->
    <rect x="200" y="280" width="40" height="60" rx="5" fill="#DC2626"/>
    <rect x="205" y="285" width="30" height="45" rx="3" fill="white"/>
    
    <rect x="360" y="260" width="50" height="40" rx="5" fill="#DC2626"/>
    <rect x="365" y="265" width="40" height="25" rx="3" fill="white"/>
    
    <!-- Connection Lines -->
    <path d="M220 280L300 200" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M385 260L300 200" stroke="#DC2626" stroke-width="2" stroke-dasharray="4 4"/>
    
    <!-- Animation -->
    <style>
        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.6; }
            100% { opacity: 0.3; }
        }
        circle[stroke] {
            animation: pulse 2s infinite;
        }
        circle[stroke]:nth-child(2) { animation-delay: 0.5s; }
        circle[stroke]:nth-child(3) { animation-delay: 1s; }
        circle[stroke]:nth-child(4) { animation-delay: 1.5s; }
    </style>
</svg> 